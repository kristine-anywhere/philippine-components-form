<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philippine Components</title>
<style>
  :root{
    --bg:#0f1b2d; --fg:#f5f7fa; --muted:#9fb0c7; --accent:#f5b642; --card:#18283f; --line:#2b3f5e; --err:#ff8080;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f7f8fb; --fg:#0f1b2d; --muted:#5b6b82; --accent:#c98a0b; --card:#ffffff; --line:#d5dce6; --err:#c0392b;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1b2d; --fg:#f5f7fa; --muted:#9fb0c7; --accent:#f5b642; --card:#18283f; --line:#2b3f5e; --err:#ff8080;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px;font-weight:700;letter-spacing:.02em;color:var(--muted);font-size:14px}
  .langs-sm{display:flex;gap:8px}
  .langs-sm button{background:none;border:2px solid transparent;border-radius:6px;padding:2px;cursor:pointer;opacity:.55}
  .langs-sm button.on{border-color:var(--accent);opacity:1}
  .flag{width:34px;height:auto;border-radius:3px;display:block}
  .flag.big{width:72px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
  .hero{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:8px 0 22px;display:block}
  .kicker{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--accent);margin:0 0 10px}
  h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:0 0 14px}
  h2{font-size:clamp(22px,4.5vw,28px);line-height:1.25;margin:0 0 14px;font-weight:650}
  .lead{font-size:17px;line-height:1.6;color:var(--muted);margin:0 0 14px}
  .bul{margin:0 0 16px;padding-left:20px;font-size:16px;line-height:1.6}
  .bul li{margin-bottom:6px}
  .small{font-size:14px}
  .cta{font-size:17px;font-weight:600;margin:6px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:28px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
  .full{grid-column:1/-1}
  @media (max-width:560px){ .grid{grid-template-columns:1fr} }
  .fld{display:flex;flex-direction:column;gap:6px}
  .lbl{font-size:14px;font-weight:600;color:var(--muted)}
  input,select{width:100%;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .fld.invalid input,.fld.invalid select{border-color:var(--err)}
  .fe{font-style:normal;color:var(--err);font-size:13px;min-height:0}
  .fe:empty{display:none}
  .phone-row{display:flex;gap:10px}
  .phone-row select{max-width:46%}
  .phone-row input{flex:1;min-width:0}
  .check{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;color:var(--fg);cursor:pointer}
  .check input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--accent)}
  .btn{display:block;width:100%;margin-top:22px;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--accent);color:#1b1404}
  .btn:disabled{opacity:.6;cursor:default}
  .formerr{color:var(--err);font-size:15px;margin-top:14px;min-height:0}
  .formerr:empty{display:none}
  .dl{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;font-size:16px}
  .dl:hover{border-color:var(--accent)}
  .dl .tag{color:var(--accent);font-weight:700;white-space:nowrap}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .sep{height:1px;background:var(--line);margin:36px 0 0}
</style>
</head>

const state = { lang: "it", v: { cc: "+39", consent: false }, sending: false, done: false };
const app = document.getElementById("app");
const T = () => TX[state.lang];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function input(key, label, { type = "text", req = false, ph = "", full = false } = {}) {
  return `<label class="fld ${full ? "full" : ""}" data-key="${key}">
    <span class="lbl">${esc(label)}${req ? " *" : ""}</span>
    <input name="${key}" type="${type}" placeholder="${esc(ph)}" value="${esc(state.v[key] ?? "")}" autocomplete="off">
    <em class="fe"></em></label>`;
}

function select(key, label, options, full = false) {
  const t = T();
  return `<label class="fld ${full ? "full" : ""}" data-key="${key}">
    <span class="lbl">${esc(label)}</span>
    <select name="${key}"><option value="">${esc(t.choose)}</option>${options.map((o, k) =>
      `<option value="${k}" ${String(state.v[key]) === String(k) ? "selected" : ""}>${esc(o[state.lang])}</option>`).join("")}</select>
    <em class="fe"></em></label>`;
}

function phoneField() {
  const t = T();
  return `<div class="fld full" data-key="phone">
    <span class="lbl">${esc(t.phoneQ)} <span style="opacity:.7">(${esc(t.optional)})</span></span>
    <div class="phone-row">
      <select name="cc" aria-label="${esc(T().phoneQ)}">${CONFIG.countries.map(c =>
        `<option value="${esc(c.dial)}" ${c.dial === state.v.cc ? "selected" : ""}>${c.flag} ${esc(c.name)} ${esc(c.dial)}</option>`).join("")}</select>
      <input name="phone" type="tel" placeholder="${esc(t.phonePh)}" value="${esc(state.v.phone ?? "")}" autocomplete="off">
    </div>
    <em class="fe"></em></div>`;
}

    <p class="lead">${esc(t.heroBody)}</p>

    <div class="sep"></div>
    <h2 style="margin-top:28px">${esc(t.aboutTitle)}</h2>
    <p class="lead">${esc(t.aboutBody)}</p>
    <ul class="bul">${t.bullets.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <p class="lead small">${esc(t.organizer)}</p>
    <p class="cta">${esc(t.aboutCta)}</p>

    <form class="card" id="form" novalidate>
      <h2>${esc(t.formTitle)}</h2>
      <div class="grid">
        ${input("name", t.nameQ, { req: true, ph: t.namePh })}
        ${input("email", t.emailQ, { type: "email", req: true, ph: t.emailPh })}
        ${input("company", t.companyQ, { req: true, ph: t.companyPh })}
        ${select("role", t.roleQ, CONFIG.roles)}
        ${input("address", t.addressQ, { req: true, ph: t.addressPh, full: true })}
        ${phoneField()}
        ${select("interest", t.interestQ, CONFIG.interests, true)}
      </div>
      <label class="check" style="margin-top:18px">
        <input name="consent" type="checkbox" ${state.v.consent ? "checked" : ""}>
        <span>${esc(t.consentLabel)}</span>
      </label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="formerr" id="formErr"></p>
      <button class="btn" id="send" type="submit" ${state.sending ? "disabled" : ""}>${esc(state.sending ? t.sending : t.submit)}</button>
    </form>`;

  bind();
}

// Legge i valori del form nello stato (prima di ri-renderizzare)
function collect() {
  app.querySelectorAll("[name]").forEach(el => {
    state.v[el.name] = el.type === "checkbox" ? el.checked : el.value;
  });
  const cc = app.querySelector('select[name="cc"]');
  if (cc) state.v.cc = cc.value;
}

function bind() {
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    collect(); state.lang = b.dataset.l; render();
  });
  const form = document.getElementById("form");
  if (form) form.onsubmit = e => { e.preventDefault(); submit(); };
}

function showErrors(errors) {
  app.querySelectorAll(".fld").forEach(f => {
    const msg = errors[f.dataset.key] || "";
    f.classList.toggle("invalid", !!msg);
    f.querySelector(".fe").textContent = msg;
  });
  const first = app.querySelector(".fld.invalid input, .fld.invalid select");
  if (first) first.focus();
}

function submit() {
  if (state.sending) return;
  collect();
  const t = T(), v = state.v, errors = {};
  if (!String(v.name || "").trim()) errors.name = t.required;
  if (!String(v.email || "").trim()) errors.email = t.required;
  else if (!isEmail(v.email.trim())) errors.email = t.emailErr;
  if (!String(v.company || "").trim()) errors.company = t.required;
  if (!String(v.address || "").trim()) errors.address = t.required;
  if (Object.keys(errors).length) { showErrors(errors); return; }
  showErrors({});

  const num = String(v.phone || "").trim();
  const payload = {
    name: v.name.trim(), email: v.email.trim(), company: v.company.trim(),
    role: v.role !== "" && v.role !== undefined ? CONFIG.roles[+v.role].it : "",
    address: v.address.trim(),
    phone: num ? `${v.cc} ${num}` : "",
    interest: v.interest !== "" && v.interest !== undefined ? CONFIG.interests[+v.interest].it : "",
    brochures: CONFIG.brochures.map(b => b.label),
    consent: !!v.consent,
    source: location.href, lang: state.lang,
    website: app.querySelector('[name="website"]')?.value || ""
  };

  state.sending = true; render();
  fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(() => { state.sending = false; state.done = true; render(); window.scrollTo(0, 0); })
    .catch(() => { state.sending = false; render(); document.getElementById("formErr").textContent = T().sendErr; });
}

render();
</script>
</body>
</html>
